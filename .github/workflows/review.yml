name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    # fork 的 PR 拿不到 secrets，跳过
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.LLM_API_KEY }}
          fail_on: ${{ vars.LLM_FAIL_ON || 'never' }}
          api_format: ${{ vars.LLM_API_FORMAT || 'openai' }}
          api_base_url: ${{ vars.LLM_API_BASE_URL || 'https://api.openai.com/v1' }}
          model: ${{ vars.LLM_MODEL || 'gpt-4.1' }}
