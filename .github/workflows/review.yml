name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  by-exact-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: brian-devis/pr-reviewer-action@v0.2.1
        with:
          api_key: ${{ secrets.LLM_API_KEY }}
          api_base_url: ${{ vars.LLM_API_BASE_URL || 'https://api.openai.com/v1' }}
          model: ${{ vars.LLM_MODEL || 'gpt-4.1' }}
  by-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: brian-devis/pr-reviewer-action@v0
        with:
          api_key: ${{ secrets.LLM_API_KEY }}
          api_base_url: ${{ vars.LLM_API_BASE_URL || 'https://api.openai.com/v1' }}
          model: ${{ vars.LLM_MODEL || 'gpt-4.1' }}
