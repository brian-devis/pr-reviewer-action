name: PR AI Reviewer
description: "AI 审查 Pull Request（行内评论 + 总评），并可在断网的 Docker 沙盒里运行测试和 Lint；两个功能相互独立"
author: brian-devis

inputs:
  github_token:
    description: "GitHub Token，需要 pull-requests: write 权限；发布 commit status 还需要 statuses: write"
    required: true
    default: ${{ github.token }}
  enable_ai_review:
    description: "是否启用 AI 评审。设为 false 时不会初始化模型，也不要求 api_key、api_base_url、model"
    required: false
    default: "true"
  enable_sandbox:
    description: "是否启用沙盒测试：在断网、限制资源的 Docker 容器里运行测试和 Lint。需要先 actions/checkout"
    required: false
    default: "false"
  api_key:
    description: "模型服务 API Key；启用 AI 评审时必填，仅运行沙盒时不需要"
    required: false
    default: ""
  sandbox_language:
    description: "沙盒里的项目类型：auto（默认，按 go.mod / package.json / pyproject.toml 等自动识别）、go、node、python"
    required: false
    default: auto
  sandbox_image:
    description: "沙盒使用的镜像，如 golang:1.25、node:22、python:3.12；留空时按 sandbox_language 选择"
    required: false
    default: ""
  sandbox_test_command:
    description: "沙盒里运行的测试命令；留空时按项目类型取默认值（Go: go test ./...，Node: npm test，Python: python -m pytest -q）"
    required: false
    default: ""
  sandbox_lint_command:
    description: "沙盒里运行的 Lint 命令；留空时按项目类型取默认值（Go: go vet ./...，Node: npm run lint，Python: python -m compileall -q .）"
    required: false
    default: ""
  sandbox_install_command:
    description: "联网准备依赖的命令，只在准备阶段执行、不执行 PR 代码；留空时按项目类型使用安全默认值（Go: go mod download，Node: npm --ignore-scripts，Python: pip --only-binary）"
    required: false
    default: ""
  sandbox_memory:
    description: "每个沙盒容器的内存上限，如 512m、1g"
    required: false
    default: "1g"
  sandbox_cpus:
    description: "每个沙盒容器的 CPU 上限，如 1、0.5"
    required: false
    default: "1"
  sandbox_timeout:
    description: "每个沙盒步骤的超时时间，如 90s、5m，最长 1h"
    required: false
    default: "5m"
  sandbox_network:
    description: "沙盒网络模式，目前只支持 none（断网）"
    required: false
    default: none
  sandbox_status_context:
    description: "沙盒的 commit status 名称"
    required: false
    default: sandbox-tests
  api_base_url:
    description: "模型服务地址；留空时按 api_format 使用默认值（openai: https://api.openai.com/v1，anthropic: https://api.anthropic.com）"
    required: false
    default: ""
  model:
    description: "模型标识；留空时按 api_format 使用默认值（openai: gpt-4.1，anthropic: claude-sonnet-5-5）"
    required: false
    default: ""
  api_format:
    description: "API 协议格式：openai（Chat Completions 兼容）或 anthropic（原生 Messages API）"
    required: false
    default: openai
  max_diff_bytes:
    description: "单次模型请求携带的 diff 最大字节数，超出会分批或截断"
    required: false
    default: "60000"
  max_requests:
    description: "单个 PR 最多发起的模型请求数，超出的文件不会被审查"
    required: false
    default: "5"
  fail_on:
    description: "达到该严重度时把 commit status 设为失败：never（默认，只提示）、error（有 error 级问题）、warning（有 error 或 warning 级问题）。需要 statuses: write 权限"
    required: false
    default: never
  status_context:
    description: "commit status 的名称，分支保护里选择它作为必需检查"
    required: false
    default: ai-review
  exclude_paths:
    description: "额外排除的路径，逗号或换行分隔，支持通配符；以 / 结尾表示目录"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # 引用 @v1 或 @v1.2.3 时下载预编译二进制；引用分支（如 @main）或下载失败时从源码构建
    - name: Download prebuilt binary
      id: dl
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set +e
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) arch="" ;;
        esac
        base=""
        if [ -n "$ACTION_REPO" ] && [ -n "$arch" ] && [ "$(uname -s)" = "Linux" ]; then
          case "$ACTION_REF" in
            v[0-9]*.[0-9]*.[0-9]*) base="https://github.com/$ACTION_REPO/releases/download/$ACTION_REF" ;;
            v[0-9]*) base="https://github.com/$ACTION_REPO/releases/latest/download" ;;
          esac
        fi
        asset="reviewer-linux-$arch"
        dir="$RUNNER_TEMP/reviewer-dl"
        # 下载二进制和校验和，校验通过才使用；任何一步失败都退回源码构建
        if [ -n "$base" ] \
          && mkdir -p "$dir" \
          && curl -fsSL --retry 3 -o "$dir/$asset" "$base/$asset" \
          && curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/checksums.txt" \
          && (cd "$dir" && grep "[ *]$asset\$" checksums.txt | sha256sum -c -); then
          mv "$dir/$asset" "$RUNNER_TEMP/reviewer"
          chmod +x "$RUNNER_TEMP/reviewer"
          echo "REVIEWER_BIN=$RUNNER_TEMP/reviewer" >> "$GITHUB_ENV"
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
          echo "使用预编译二进制 ($ACTION_REF)，校验和通过"
        else
          echo "未使用预编译二进制，将从源码构建"
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-go@v5
      if: steps.dl.outputs.downloaded != 'true'
      with:
        go-version: "1.22"
        cache: false

    - name: Build from source
      if: steps.dl.outputs.downloaded != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        go build -trimpath -o "$RUNNER_TEMP/reviewer" ./cmd/reviewer
        echo "REVIEWER_BIN=$RUNNER_TEMP/reviewer" >> "$GITHUB_ENV"

    - name: Run reviewer
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_FORMAT: ${{ inputs.api_format }}
        INPUT_MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
        INPUT_MAX_REQUESTS: ${{ inputs.max_requests }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_STATUS_CONTEXT: ${{ inputs.status_context }}
        INPUT_ENABLE_AI_REVIEW: ${{ inputs.enable_ai_review }}
        INPUT_ENABLE_SANDBOX: ${{ inputs.enable_sandbox }}
        INPUT_SANDBOX_LANGUAGE: ${{ inputs.sandbox_language }}
        INPUT_SANDBOX_IMAGE: ${{ inputs.sandbox_image }}
        INPUT_SANDBOX_TEST_COMMAND: ${{ inputs.sandbox_test_command }}
        INPUT_SANDBOX_LINT_COMMAND: ${{ inputs.sandbox_lint_command }}
        INPUT_SANDBOX_INSTALL_COMMAND: ${{ inputs.sandbox_install_command }}
        INPUT_SANDBOX_MEMORY: ${{ inputs.sandbox_memory }}
        INPUT_SANDBOX_CPUS: ${{ inputs.sandbox_cpus }}
        INPUT_SANDBOX_TIMEOUT: ${{ inputs.sandbox_timeout }}
        INPUT_SANDBOX_NETWORK: ${{ inputs.sandbox_network }}
        INPUT_SANDBOX_STATUS_CONTEXT: ${{ inputs.sandbox_status_context }}
      run: '"$REVIEWER_BIN"'
